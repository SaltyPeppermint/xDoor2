schema_version = 1

[device]
hostname = "xdoor2"

[ssh]
listen_address = "0.0.0.0"
port = 22
host_key = "/run/credentials/xdoor2.service/ssh_host_key"
greeting = "/etc/xdoor2/greeting"

[storage]
directory = "/data/xdoor2"
# Created by the tmpfiles xdoor2.nix, 0 = "uncalibrated"
door_distance_file = "/data/xdoor2/door_distance"

[authorized_keys]
url = "https://xdoor.x-hain.de/authorized_keys"
signature_url = "https://xdoor.x-hain.de/authorized_keys.sig"
verify_key_path = "/etc/xdoor2/authorized_keys_pub.pem"
cache_file = "/data/xdoor2/authorized_keys"
admin_keys_path = "/etc/xdoor2/admin_keys"
update_interval_seconds = 300

[gpio]
enabled = true
chip = "/dev/gpiochip0"
pul_line = 22
dir_line = 23
ena_line = 24

[mqtt]
host = "homeassistant.lan.xhain.space"
port = 1883
username = "homeassistant"
password_file = "/run/credentials/xdoor2.service/mqtt_password"
client_id = "xdoor2"
discovery_prefix = "homeassistant"

[monitor]
enabled = true
network_interface = "eth0"
network_failure_reboot_seconds = 300
health_check_interval_seconds = 60

[logging]
level = "INFO"
login_log = "/data/xdoor2/logins"
lock_state_log = "/data/xdoor2/lock_state_changes"
